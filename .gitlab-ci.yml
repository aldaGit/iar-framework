stages:
  - dependencies
  - test
  - build
  - deploy

variables:
  ANGULAR_CLI_VERSION: 22.1.2
  NODE_VERSION: 24.19.0

.backend_rules:
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      changes:
        - backend/**/*
        - backend/*
        - .gitlab-ci.yml

.frontend_rules:
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      changes:
        - frontend/**/*
        - frontend/*
        - .gitlab-ci.yml

.node:
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm config set registry https://sepp-nexus.inf.h-brs.de/repository/npm/

.with-proxy:
  variables:
    HTTP_PROXY: "http://www-cache:8080"
    HTTPS_PROXY: "http://www-cache:8080"
    http_proxy: "http://www-cache:8080"
    https_proxy: "http://www-cache:8080"

install-dependencies:backend:
  extends: .node
  stage: dependencies
  script:
    - cd backend
    - npm install
  rules:
    - !reference [.backend_rules, rules]
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - backend/node_modules

unit-test:backend:
  extends: .node
  stage: test
  rules:
    - !reference [ .backend_rules, rules ]
  needs:
    - install-dependencies:backend
  script:
    - cd backend
    - npm run coverage
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - ./backend/results/test-junit.xml
      coverage_report:
        coverage_format: cobertura
        path: ./backend/coverage/cobertura-coverage.xml
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - backend/node_modules
    policy: pull

deploy:backend:
  stage: deploy
  image: keymetrics/pm2:latest-alpine
  extends: .with-proxy
  rules:
    - !reference [ .backend_rules, rules ]
  needs:
    - unit-test:backend
  script:
    - echo "====== Deploy backend to production server ======"
    - apk update && apk upgrade
    - apk add openssh bash git
    # Add target server`s secret key
    - mkdir ~/.ssh
    - echo $TARGET_SERVER_SECRET_KEY_BASE64 | base64 -d > ~/.ssh/id_rsa
    - chmod 700 ~/.ssh && chmod 600 ~/.ssh/*
    - echo "Test ssh connection"
    - ssh -o StrictHostKeyChecking=no -T "$TARGET_SERVER_USER@$BACKEND_SERVER_HOST" pm2 status
    # Deploy
    #- sed -i "s/\process.env.NODE_VERSION/'${NODE_VERSION}'/g" backend/ecosystem.config.js
    - cat backend/ecosystem.config.js
    - echo "Setup tagged server directories"
    - pm2 deploy backend/ecosystem.config.js production setup 2>&1 || true
    - echo "make deploy"
    - pm2 deploy backend/ecosystem.config.js production

install-dependencies:frontend:
  extends: .node
  stage: dependencies
  script:
    - cd frontend
    - npm install
  rules:
    - !reference [ .frontend_rules, rules ]
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules

lint:frontend:
  extends: .node
  stage: test
  rules:
    - !reference [ .frontend_rules, rules ]
  needs:
    - install-dependencies:frontend
  script:
    - cd frontend
    - npm link @angular/cli@$ANGULAR_CLI_VERSION
    - ng lint
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules
    policy: pull

.test:frontend: #this job is disabled by default (you may enable it, by removing the leading dot ("."), if frontend-testing is required)
  extends: .node
  stage: test
  needs:
    - install-dependencies:frontend
  rules:
    - !reference [ .frontend_rules, rules ]
  script:
    - cd frontend
    - npm link @angular/cli@$ANGULAR_CLI_VERSION
    - npm test
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: ./frontend/reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: ./frontend/coverage/app/cobertura-coverage.xml
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules
    policy: pull

build:frontend:
  extends:
    - .node
    - .with-proxy
  stage: build
  rules:
    - !reference [ .frontend_rules, rules ]
  needs:
    - lint:frontend
    #- test:frontend
  script:
    - cd frontend
    - npm link @angular/cli@$ANGULAR_CLI_VERSION
    - npm run build -- --base-href=/$TARGET_SERVER_USER/
  artifacts:
    paths:
      - frontend/dist
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules
    policy: pull

deploy:frontend:
  image: alpine
  stage: deploy
  extends: .with-proxy
  rules:
    - !reference [ .frontend_rules, rules ]
  needs:
    - build:frontend
  artifacts:
    when: always
    paths:
      - /root/.npm/
  script:
    - echo "====== Deploy frontend to production server ======"
    - apk update && apk add openssh-client
    - cd frontend
    - ls dist
    - mkdir ~/.ssh
    - printf "%s" $TARGET_SERVER_SECRET_KEY_BASE64 | base64 -d > ~/.ssh/id_rsa
    - chmod 700 ~/.ssh && chmod 600 ~/.ssh/*
    - echo "Test ssh connection"
    - ssh -o StrictHostKeyChecking=no -T "$TARGET_SERVER_USER@$FRONTEND_SERVER_HOST" hostname
    - ssh  "$TARGET_SERVER_USER@$FRONTEND_SERVER_HOST" rm -rf app &&  mkdir app
    - scp -r dist/app/browser/* "$TARGET_SERVER_USER@$FRONTEND_SERVER_HOST:./app"
